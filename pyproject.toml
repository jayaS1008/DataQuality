[project]
name = "dataquality"
version = "0.1.0"
description = "LangGraph-based product data quality, enhancement, and impact analysis copilot"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataquality"]

[tool.pytest.ini_options]
pythonpath = ["src"]
